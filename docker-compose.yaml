services:
  parakeet:
    build:
      context: .
      args:
        - PARAKEET_MODEL=${PARAKEET_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
        - SILERO_VAD_REPO=${SILERO_VAD_REPO:-snakers4/silero-vad}
    container_name: ${COMPOSE_PROJECT_NAME}-parakeet-asr
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - LOG_LEVEL=INFO
      - HF_HUB_OFFLINE=1
      - PARAKEET_MODEL=${PARAKEET_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
    volumes:
      - ./data/cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - frontend

networks:
  frontend:
    external: true
    name: ${FRONTEND_NETWORK}
